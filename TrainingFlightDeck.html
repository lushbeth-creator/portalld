<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrainingFlightDeck</title>
<style>
:root{--blue:#5D70AE;--green:#59A398;--light:#DAF3EF;--purple:#A6B3D5;--pale:#F3F6FF;--navy:#1B2F5B;--ink:#000}
*{box-sizing:border-box}
html,body{background:transparent}
body{margin:0;padding:14px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--navy)}
main{max-width:100%;margin:0}
.nav-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.pill{display:inline-block;background:linear-gradient(to bottom,#ffffff 0%,var(--light) 100%);color:var(--navy);font-size:14px;font-weight:700;padding:10px 18px;border-radius:999px;border:1px solid var(--purple);text-decoration:none;white-space:nowrap;transition:.15s ease}
.pill:hover,.pill:focus-visible{border-color:var(--blue);background:linear-gradient(to bottom,#ffffff 0%,#E4E9F7 100%);outline:none}
@media(max-width:700px){.nav-row{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}}
</style>
</head>
<body>
<main>
<nav class="nav-row" aria-label="Learning and Development home sections">

  <a class="pill" target="_top" href="https://propelrpay1.sharepoint.com/sites/Training/SitePages/LearningTeamHome.aspx#development-_____________________________________________________________________________________">Development</a>

</nav>
</main>
</body>
</html>
