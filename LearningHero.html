<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LearningHero</title>
<style>
:root{--blue:#5D70AE;--green:#59A398;--light:#DAF3EF;--purple:#A6B3D5;--pale:#F3F6FF;--navy:#1B2F5B;--ink:#000}
*{box-sizing:border-box}
html,body{background:transparent}
body{margin:0;padding:14px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--navy)}
h1,h2,h3{font-family:"Qualy Neue",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:100%;margin:0}
.eyebrow{display:block;margin:0 0 6px;color:var(--green);font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.intro{margin:0;color:var(--ink);font-size:18px;line-height:1.55}
.head{margin:0 0 18px}
.icon-box{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:linear-gradient(to bottom,#F3F6FF 0%,#E4E9F7 100%);border:1px solid #A6B3D5;color:#59A398}
.icon-box svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{position:relative;border:1px solid var(--purple);border-radius:14px;background:linear-gradient(to bottom,#ffffff 0%,#E8EDF8 100%);color:inherit;text-decoration:none;transition:transform .18s ease,border-color .18s ease,background .18s ease}
.card:hover,a.card:focus-visible{transform:scale(1.015);border-color:var(--green);background:linear-gradient(to bottom,#ffffff 0%,var(--light) 100%);outline:none}
.card.primary{background:linear-gradient(to bottom,#ffffff 0%,var(--light) 100%)}
.label{display:block;margin-bottom:2px;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.card h2{margin:0;font-size:20px;line-height:1.25;font-weight:700;color:var(--navy)}
.card p{margin:0;color:var(--ink);font-size:14px;line-height:1.5}
.action{display:flex;align-items:center;gap:6px;margin-top:10px;color:var(--blue);font-size:14px;font-weight:800;white-space:nowrap}
.action svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
a.card:hover .action{color:var(--green)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto}
.btn-solid{display:inline-block;background:var(--blue);color:#fff;font-size:14px;font-weight:700;padding:11px 18px;border-radius:8px;text-decoration:none}
.btn-solid:hover,.btn-solid:focus-visible{background:var(--navy);outline:none}
.btn-outline{display:inline-block;background:#fff;color:var(--navy);font-size:14px;font-weight:700;padding:11px 18px;border-radius:8px;border:1px solid var(--purple);text-decoration:none}
.btn-outline:hover,.btn-outline:focus-visible{background:var(--pale);outline:none}
.text-link{color:var(--green);font-weight:750;text-decoration:none}
.text-link:hover,.text-link:focus-visible{color:var(--blue);text-decoration:underline}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.card:hover,a.card:focus-visible{transform:none!important}}

.hero{padding:26px 28px;border:1px solid var(--purple);border-radius:20px;background:linear-gradient(135deg,#F8F9FF 0%,#F3F6FF 55%,#EAF5F3 100%)}
.hero h1{margin:0 0 8px;color:var(--navy);font-size:20px;line-height:1.25;font-weight:700}
.hero .intro{margin:0 0 20px}
.hero .btn-row{margin-top:0}
.hero button.btn-solid{border:0;cursor:pointer;font-family:inherit}
@media(max-width:680px){body{padding:8px}.hero{padding:20px 18px}}
</style>
</head>
<body>
<!-- TODO: Explore Learning is intentionally inactive (no action yet). Wire it to #learning-paths (target="_top") or a page URL when ready. -->
<main>
<section class="hero">
  <span class="eyebrow">Learning &amp; Development</span>
  <h1>Learn. Grow. Propel Forward.</h1>
  <p class="intro">Build the knowledge and skills you need to succeed in your role, strengthen how we work together and continue growing at Propelr.</p>
  <div class="btn-row">
    <button class="btn-solid" type="button">Explore Learning</button>
    <a class="btn-outline" href="mailto:learning@propelrpay.com">Connect with L&amp;D</a>
  </div>
</section>
</main>

</body>
</html>
